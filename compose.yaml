name: senvalise
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senvalise
      POSTGRES_USER: senvalise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senvalise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senvalise -d senvalise"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://senvalise:${POSTGRES_PASSWORD:-senvalise}@postgres:5432/senvalise?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gerant@senvalise.sn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      SEED_DEMO: ${SEED_DEMO:-true}
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:4000,http://127.0.0.1:4000
      TZ: Africa/Dakar
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:80"      # espace de gestion
      - "4000:8080"    # boutique en ligne
    volumes:
      # La boutique est un site statique : on la monte plutot que de la cuire
      # dans l'image, elle se modifie sans reconstruire le conteneur. Le
      # chemin pointait vers un depot voisin, hors du contexte : cloner
      # senvalise seul donnait une boutique vide.
      - ./site:/usr/share/nginx/boutique:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
