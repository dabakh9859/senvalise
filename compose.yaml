name: senvalise
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: senvalise
      POSTGRES_USER: senvalise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senvalise}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senvalise -d senvalise"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://senvalise:${POSTGRES_PASSWORD:-senvalise}@postgres:5432/senvalise?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-gerant@senvalise.sn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      APP_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      TZ: Africa/Dakar
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
