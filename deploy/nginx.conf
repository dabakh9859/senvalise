# Deux sites servis par le meme nginx, donc la meme origine que l'API :
# aucun CORS a gerer, aucune URL d'API a configurer dans la boutique.
#
#   :80   espace de gestion (SPA React)
#   :8080 boutique en ligne (site statique)
#
# Les deux exposent /api, /uploads et /shop. /shop sert les images du
# catalogue : l'API renvoie des chemins /shop/assets/img/..., qui doivent
# donc se resoudre depuis les deux ports.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location /uploads/ { proxy_pass http://api:8080; }
  location /health { proxy_pass http://api:8080/health; }

  location /shop/ {
    alias /usr/share/nginx/boutique/;
    expires 7d;
    access_log off;
  }

  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/boutique;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location /uploads/ { proxy_pass http://api:8080; }
  location /health { proxy_pass http://api:8080/health; }

  location /shop/ {
    alias /usr/share/nginx/boutique/;
    expires 7d;
    access_log off;
  }

  # Site statique : chaque page est un fichier, pas de routage cote client.
  location / { try_files $uri $uri/ $uri.html =404; }
}
