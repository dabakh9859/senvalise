# Deux sites servis par le meme nginx, donc la meme origine que l'API :
# aucun CORS a gerer, aucune URL d'API a configurer dans la boutique.
#
#   :80   espace de gestion (SPA React)
#   :8080 boutique en ligne (site statique)
#
# Les deux exposent /api, /uploads et /shop. /shop sert les images du
# catalogue : l'API renvoie des chemins /shop/assets/img/..., qui doivent
# donc se resoudre depuis les deux ports.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location /uploads/ { proxy_pass http://api:8080; }
  location /health { proxy_pass http://api:8080/health; }

  location /shop/ {
    alias /usr/share/nginx/boutique/;
    expires 7d;
    access_log off;
  }

  # index.html ne doit jamais etre mis en cache : il porte le nom hache du
  # bundle courant. Un index perime renvoie le navigateur vers un fichier
  # supprime, ou pire, laisse l'ancienne interface a l'ecran apres un
  # deploiement — le symptome etait exactement celui-la.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Les fichiers d'assets portent un hachage dans leur nom : leur contenu ne
  # change jamais sous une meme URL, ils se cachent donc sans limite.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/boutique;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
  }
  location /uploads/ { proxy_pass http://api:8080; }
  location /health { proxy_pass http://api:8080/health; }

  location /shop/ {
    alias /usr/share/nginx/boutique/;
    expires 7d;
    access_log off;
  }

  # Images et polices : leur contenu bouge rarement, elles se cachent.
  location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=604800" always;
  }

  # Tout le reste — pages, CSS, JS — porte un nom fixe et se modifie sur
  # place : le navigateur doit revalider a chaque fois, sans quoi une page
  # corrigee reste invisible. La regle vit ici et non sur « .html » : les
  # URL de la boutique n'ont pas d'extension, /boutique n'aurait pas matche.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
